# Render Blueprint (§8 Phase 8). Syntax verified against Render's current docs
# (blueprint-spec, redirects-rewrites, python-version, compute-plans,
# node-version) rather than trusting the roadmap's sketch unverified (rule
# 12). Full debugging history for every issue actually hit while deploying
# this — the static site's `plan` field, `NODE_VERSION`, a symlink that
# broke the build, and a 500-vs-404 bug in the API's /thumbs route — is in
# docs/DECISIONS.md, not repeated here as file-comment archaeology.
#
# Service URLs are Render's default `https://<name>.onrender.com` pattern —
# predictable from the `name` fields below, so FRONTEND_ORIGINS and
# VITE_API_BASE_URL are set directly rather than left for manual dashboard
# entry. If a name collision ever forces Render to assign a different host,
# these two values need updating to match.

services:
  - type: web
    name: ashiana-recs-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # D3 (docs/DECISIONS.md): artifacts/thumbs/ is deliberately gitignored —
    # no written permission from Ashiana to redistribute their product
    # photography, and this is a public internship submission. This service
    # never has any thumbnail files to serve, by design: /thumbs/{sku}.webp
    # 404s cleanly for every SKU. Everything else here (ranking, fusion,
    # category fallback, evaluation) is real and fully functional against
    # the actual 472-product catalog — only the photos are absent.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: FRONTEND_ORIGINS
        value: https://ashiana-recs-ui.onrender.com

  - type: web
    name: ashiana-recs-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: VITE_API_BASE_URL
        value: https://ashiana-recs-api.onrender.com
