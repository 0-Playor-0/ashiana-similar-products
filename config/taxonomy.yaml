# Normalization tables used by pipeline/clean.py.
#
# `product_type_map` / `collection_map` translate the site's own category and
# collection names into our normalized vocabulary (Product.product_type /
# Product.collection in pipeline/schema.py).
#
# `materials_vocab` / `stones_vocab` / `colors_vocab` are the term lists
# clean.py matches against title+description for keyword attribute extraction
# (§6). They were built by frequency-scanning the scraped catalog text
# (data/raw/2026-09-11), not guessed — see docs/DECISIONS.md.
#
# The *_similarity tables (Phase 3, D5) say how similar two vocabulary values
# are to each other (0..1, symmetric, unlisted pairs = 0, self = 1 — §8 Phase
# 3). PROPOSED below from the catalog's actual distribution as of 2026-09-12
# (data_report.json), pending user approval — see docs/DECISIONS.md.

product_type_map:
  Bracelet: bangle_bracelet
  Brooch: brooch
  Earrings: earrings
  Hair accessories: hair_accessory
  Home Decor: home_decor
  Necklace and Jewellery Sets: necklace_jewelry_set
  Rings: ring

collection_map:
  Antique Jewellery: antique
  Kundan Jewellery: kundan
  Zircon Jewellery: zircon
  Crystal Jewellery: crystal
  Oxidised Jewellery: oxidised
  Contemporary Jewellery: contemporary
  92.5 Sterling Silver: sterling_silver

synonyms:
  cz: zircon
  cubic zirconia: zircon
  american diamond: zircon
  ad: zircon
  oxidized: oxidised
  jhumki: jhumka
  gold plated: gold_plated
  gold-plated: gold_plated
  rose gold: rose_gold_plated
  rose gold plated: rose_gold_plated
  sterling silver: sterling_silver
  stainless steel: stainless_steel
  multicolour: multi
  multicolor: multi
  multi colour: multi
  multi-colour: multi

# matched as whole phrases first (longest first), then single words, against
# lowercased title+description; a hit fills Product.materials with
# provenance="keyword" (only when the field is still empty after any
# source-provided value — see clean.py)
materials_vocab:
  - sterling_silver
  - gold_plated
  - rose_gold_plated
  - gold
  - silver
  - oxidised
  - brass
  - alloy
  - rhodium
  - platinum
  - stainless_steel

stones_vocab:
  - zircon
  - pearl
  - crystal
  - kundan
  - diamond
  - ruby
  - sapphire
  - emerald
  - opal
  - jade
  - moonstone
  - onyx
  - rhinestone
  - gemstone

colors_vocab:
  - gold
  - silver
  - black
  - white
  - red
  - blue
  - green
  - pink
  - purple
  - yellow
  - orange
  - maroon
  - multi

# --- Phase 3 (D5 PROPOSAL — pending user approval, not final) ---
#
# Catalog counts by product_type (data_report.json, 2026-09-12): earrings 338,
# necklace_jewelry_set 78, hair_accessory 17, bangle_bracelet 10, home_decor 10,
# ring 10, brooch 9.
#
# home_decor deliberately has no listed pairs (similarity 0 with everything,
# including itself only via the self=1 rule) — under this project's LOCKED
# "substitutes" definition (§1: something a shopper would buy *instead of*
# this item), a candle stand is never a substitute for a ring, so it should
# never backfill the fallback for a jewelry query, and jewelry should never
# backfill for it either.
product_type_similarity:
  earrings|hair_accessory: 0.3      # both worn near the head/ear
  earrings|brooch: 0.2              # both small pinned/clipped decorative pieces
  earrings|necklace_jewelry_set: 0.3  # frequently sold and worn as matching sets
  necklace_jewelry_set|brooch: 0.3    # both chest/neckline-area pieces
  necklace_jewelry_set|bangle_bracelet: 0.3  # both often bought as part of a set
  bangle_bracelet|ring: 0.5         # both hand/wrist adornment, closest cross-type pair
  brooch|hair_accessory: 0.2        # both small pinned/clipped accent pieces

# Catalog counts by collection: contemporary 50, sterling_silver 45, antique 10,
# crystal 9, kundan 9, oxidised 7, zircon 6. 336/472 products have no collection
# tag at all (§ Phase 0 data_report.json) — collection_similarity only ever
# applies to the ~29% that do.
collection_similarity:
  antique|oxidised: 0.6       # both an aged/vintage metal aesthetic
  antique|kundan: 0.4         # kundan pieces are frequently styled antique-traditional
  zircon|crystal: 0.6         # both faceted, sparkly stone-forward pieces
  zircon|contemporary: 0.3
  crystal|contemporary: 0.3
  sterling_silver|oxidised: 0.4   # oxidised finish is commonly applied over sterling silver
  sterling_silver|contemporary: 0.3
  kundan|zircon: 0.2          # both stone-set, different design tradition

# Canonical values only (materials_vocab above) — the LLM-descriptor backfill
# (pipeline/describe.py, when keyword extraction left a field empty) has
# started introducing free-form values straight from the model's own wording
# ("Metal", "Bronze", "gun metal", "crystals", ...) that were never run through
# materials_vocab normalization. Gower similarity treats any unlisted value as
# 0 similarity to everything (correct per the roadmap's own missing-value
# handling), so this isn't broken, just less richly compared for those
# specific products — noted in DECISIONS.md as a follow-up, not fixed here
# (pipeline/describe.py is explicitly out of scope for this pass).
material_similarity:
  gold_plated|rose_gold_plated: 0.7   # roadmap's own worked example (§8 Phase 3)
  gold_plated|silver: 0.2             # roadmap's own worked example (§8 Phase 3)
  gold_plated|gold: 0.8               # same visual finish, different construction
  gold|rose_gold_plated: 0.5          # same family, warmer/cooler tone difference
  silver|sterling_silver: 0.8         # sterling silver *is* silver, just an alloy purity claim
  silver|rhodium: 0.6                 # rhodium plating is usually applied over silver-look base
  silver|platinum: 0.5                # visually similar white metals
  silver|stainless_steel: 0.5         # visually similar white metals
  platinum|rhodium: 0.6               # both premium white-metal finishes
  brass|alloy: 0.5                    # both common base metals for plated pieces
  brass|gold_plated: 0.3              # brass is the frequent base metal under gold plating
  oxidised|silver: 0.3                # oxidising is usually applied to silver, but darkens it
  oxidised|brass: 0.3
  stainless_steel|alloy: 0.4
