name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install pydantic==2.13.5 pyyaml==6.0.3 ruff==0.16.7 pytest==8.4.2 google-genai==2.23.0
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
