<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture: an offline pipeline builds a versioned artifact bundle from the catalog; the online API loads it once and serves ranking requests to the React UI.">
  <rect x="0" y="0" width="820" height="300" fill="#FFF8F2"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4A2712"/>
    </marker>
  </defs>

  <text x="16" y="20" fill="#7A2E2E" font-size="11" font-family="Inter, -apple-system, Segoe UI, sans-serif">OFFLINE (rerun when the catalog changes)</text>

  <g>
    <rect x="16" y="30" width="110" height="44" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="71" y="56" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">catalog.jsonl</text>
  </g>
  <line x1="126" y1="52" x2="166" y2="52" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="166" y="30" width="110" height="44" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="221" y="49" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">DINOv2-small</text>
    <text x="221" y="63" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">bge-small-en</text>
  </g>
  <line x1="276" y1="52" x2="316" y2="52" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="316" y="30" width="120" height="44" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="376" y="49" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">S_image / S_text</text>
    <text x="376" y="63" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">S_meta</text>
  </g>
  <line x1="436" y1="52" x2="476" y2="52" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="476" y="30" width="130" height="44" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="541" y="49" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">core.fusion</text>
    <text x="541" y="63" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">offdiag_zscore</text>
  </g>
  <line x1="606" y1="52" x2="646" y2="52" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="646" y="20" width="150" height="64" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="721" y="42" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">artifacts/</text>
    <text x="721" y="56" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">matrices + manifest</text>
    <text x="721" y="70" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">(committed to git)</text>
  </g>

  <line x1="721" y1="84" x2="721" y2="130" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <text x="16" y="160" fill="#7A2E2E" font-size="11" font-family="Inter, -apple-system, Segoe UI, sans-serif">ONLINE</text>

  <g>
    <rect x="476" y="170" width="150" height="44" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="551" y="189" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">FastAPI (numpy only)</text>
    <text x="551" y="203" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">loads bundle at startup</text>
  </g>
  <line x1="646" y1="192" x2="686" y2="192" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="686" y="160" width="110" height="64" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="741" y="182" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">React UI</text>
    <text x="741" y="196" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">catalog · product</text>
    <text x="741" y="210" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">under-the-hood</text>
  </g>

  <line x1="476" y1="192" x2="356" y2="192" stroke="#4A2712" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="236" y="170" width="120" height="44" rx="4" fill="#FFF8F2" stroke="#C97327" stroke-width="1"/>
    <text x="296" y="189" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">core.filters</text>
    <text x="296" y="203" text-anchor="middle" fill="#4A2712" font-size="12" font-family="Inter, -apple-system, Segoe UI, sans-serif">core.reasons</text>
  </g>
</svg>
